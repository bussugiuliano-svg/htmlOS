<html lang="it"><head><meta charset="utf-8"><title>htmlOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

.wc{display:flex;align-self:flex-start;margin-right:-7px}.win.max .wc{margin-right:0}

.wb{flex:1;background:var(--win);color:var(--fg);overflow:auto;position:relative;border:1px solid rgba(0,0,0,.35);min-height:0}
.rz{position:absolute}.rz.e{right:0;top:0;bottom:0;width:7px;cursor:ew-resize}.rz.s{bottom:0;left:0;right:0;height:7px;cursor:ns-resize}.rz.se{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}

.b:hover{border-color:var(--accent);background:rgba(255,255,255,.14)}.b.p{background:var(--accent);border-color:transparent;color:#fff}

.bar{display:flex;gap:6px;padding:6px;align-items:center;background:var(--win2);border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}

.si{padding:5px 14px;cursor:pointer;white-space:nowrap}.si:hover{background:var(--ctl)}.si.on{background:color-mix(in srgb,var(--accent) 45%,transparent)}

.main.lst{flex-direction:column;flex-wrap:nowrap;gap:0}.lst .it{width:auto;display:flex;align-items:center;gap:8px;text-align:left;padding:3px 6px}.lst .ic{font-size:16px}.lst .nm{flex:1}.lst .mt{width:80px;color:var(--dim);font-size:12px}.lst .mt2{width:140px;color:var(--dim);font-size:12px}

.st{display:flex;height:100%}.snav{width:200px;background:var(--win2);overflow:auto;padding:6px 0;flex:none;border-right:1px solid var(--line)}
.spage{flex:1;overflow:auto;padding:14px 22px;user-select:text;-webkit-user-select:text}.spage h2{margin:0 0 12px;font-weight:300;font-size:24px}

.ctl{display:flex;align-items:center;gap:6px}

.pre{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.pc{border:2px solid var(--line);padding:8px;cursor:pointer}.pc.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}

.tile:hover{border-color:rgba(255,255,255,.75)}.tile .i{font-size:calc(var(--ts)*.42);text-align:center;margin:auto;line-height:1}.tile .n{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stf{display:flex;gap:6px;justify-content:flex-end}

.modal{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:15000;display:flex;align-items:center;justify-content:center}

.dbd{padding:14px;background:var(--win);color:var(--fg)}.dbd p{margin:0 0 8px;white-space:pre-wrap}.dbt{display:flex;flex-direction:row-reverse;gap:8px;padding:8px 12px}
.pk{width:440px}.pl{height:220px;overflow:auto;background:var(--inp);border:1px solid var(--line);margin:6px 0}.pi{padding:3px 8px;cursor:default}.pi:hover{background:var(--ctl)}.pi.sel{background:color-mix(in srgb,var(--accent) 45%,transparent)}.pp{color:var(--dim)}
.cm{position:absolute;z-index:16000;min-width:190px;padding:3px;box-shadow:var(--sh)}.cm .mi{padding:5px 22px;cursor:default}.cm .mi:hover{background:color-mix(in srgb,var(--accent) 60%,transparent)}.cm .mi.off{opacity:.4;pointer-events:none}.cm hr{border:0;border-top:1px solid rgba(255,255,255,.25);margin:3px 0}

#off{position:fixed;inset:0;z-index:30000;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
</style></head><body>

<script id="hos-main">

 addEventListener('beforeunload',flush);
 const norm=p=>{const o=[];String(p==null?'/':p).split('/').forEach(s=>{if(!s||s==='.')return;s==='..'?o.pop():o.push(s)});return'/'+o.join('/')};

  mkdir(p){p=norm(p);if(p==='/')return;if(T[p]&&!T[p].d)throw Error('Esiste un file con questo nome');f.mkdir(par(p));if(!T[p]){T[p]={d:1,m:Date.now()};save();K.emit('fs',p)}},

 };
 return f})();

/* settings */

K.api=(r,rt)=>{
 const has=x=>r.perms.includes(x)||r.perms.includes('system');
 const need=x=>{if(!has(x))throw Error('Permesso mancante «'+x+'» per '+r.name)};

 const own='/Apps/'+r.id,F=K.fs,wins=new Set();let wreg=0;
 const fp=(p,w)=>{p=F.norm(p==null?own:String(p)[0]==='/'?p:own+'/'+p);if(p===own||p.startsWith(own+'/')){if(!(has('storage')||has(w?'fs.write':'fs.read')))need('storage')}else need(w?'fs.write':'fs.read');return p};

 const os={id:r.id,name:r.name,version:r.version,config:r.config,perms:r.perms.slice(),has,fs,
  saveConfig:()=>K.pk.persist(),
  log:(...a)=>{rt.log.push(a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '));if(rt.log.length>80)rt.log.shift();console.log('['+r.id+']',...a)},
  notify:(t,m)=>{need('notify');K.notify(t,m)},
  net:(u,o)=>{need('net');return fetch(u,o)},

  ui:{
   window(o){need('ui.window');const w=K.wm.create(Object.assign({appId:r.id,icon:r.icon},o));wins.add(w);w.onclose.push(()=>wins.delete(w));if(!wreg){wreg=1;reg(()=>[...wins].forEach(x=>x.close()))}return w},
   alert:(m,t)=>{need('ui.window');return K.alert(m,t)},confirm:(m,t)=>{need('ui.window');return K.confirm(m,t)},prompt:(m,d,t)=>{need('ui.window');return K.prompt(m,d,t)},

   contextMenu(where,fn){need('ui.menu');(K.ctx[where]||(K.ctx[where]=[])).push(fn);reg(()=>{const a=K.ctx[where];a.splice(a.indexOf(fn),1)})}},

   set:(k,v)=>{need('settings.write');if(k==='pw'||(k&&typeof k==='object'&&'pw' in k))throw Error('La password non è modificabile dai pacchetti');K.cfg.set(k,v)},
   page(p){need('settings.page');const q={id:r.id+'.'+p.id,t:p.title,i:p.icon,custom:p.render};K.sPages.push(q);reg(()=>K.sPages.splice(K.sPages.indexOf(q),1))}},

   launch:(id,a)=>{need('apps.launch');return K.launch(id,a)},list:()=>{need('apps.launch');return Object.values(K.apps).map(a=>({id:a.id,name:a.name}))}},
  events:{on(n,f){need('events');reg(K.on(n,f))},emit:(n,...a)=>{need('events');K.emit(n,...a)}},

 Object.defineProperty(os,'system',{get(){need('system');return{kernel:K,patch(o,k,wrap){const orig=o[k],nf=wrap(orig);o[k]=nf;const d=()=>{if(o[k]===nf)o[k]=orig};reg(d);return d}}}});

K.pk=(()=>{const L=J('hos.pk',[]),RT={};
 const save=()=>S('hos.pk',L);
 const p={list:L,persist:save,rt:id=>RT[id]||{dis:[],log:[],err:null},get:id=>L.find(x=>x.id===id),
  check(m){if(!m||typeof m!=='object')return'Il file non è un pacchetto htmlOS.';if(!/^[\w.\-]{2,60}$/.test(m.id||''))return'Campo "id" mancante o non valido (lettere, numeri, . _ -).';if(!m.name)return'Campo "name" mancante.';if(typeof m.code!=='string'&&!m.css)return'Serve almeno "code" (stringa JavaScript) oppure "css".';if(m.permissions&&!Array.isArray(m.permissions))return'"permissions" deve essere un array.';return null},
  install(m,o){const old=p.get(m.id);if(old)p.unload(old);
   const rec={id:m.id,name:String(m.name),version:String(m.version||'1'),icon:m.icon||'🧩',description:m.description||'',preset:o.preset,perms:o.perms.filter(x=>P[x]),enabled:true,code:m.code||'',css:m.css||'',files:m.files||{},config:Object.assign({},m.config||{},old?old.config:{}),requested:m.permissions||[]};
   if(old)L[L.indexOf(old)]=rec;else L.push(rec);save();p.load(rec,true);K.emit('pk');return rec},
  load(r,fresh){const rt=RT[r.id]={dis:[],log:[],err:null};if(!r.enabled)return;
   try{const os=K.api(r,rt);if(os.has('storage')||os.has('fs.write'))K.fs.mkdir(os.fs.own);
    if(r.css){if(os.has('ui.css'))os.ui.css(r.css);else rt.log.push('Il campo css è stato ignorato: manca il permesso ui.css')}
    if(fresh)for(const f in r.files){try{os.fs.write(f,r.files[f])}catch(e){rt.log.push('file '+f+': '+e.message)}}
    if(r.code){const x=runCode(r.code)(os,r.config,{id:r.id,name:r.name,version:r.version});
     if(x&&typeof x.then==='function')x.then(y=>{if(y&&typeof y.stop==='function')rt.dis.push(y.stop)},e=>{rt.err=String(e&&e.message||e);K.notify('Errore in '+r.name,rt.err);K.emit('pk')});
     else if(x&&typeof x.stop==='function')rt.dis.push(x.stop)}
   }catch(e){rt.err=e.message;K.notify('Errore in '+r.name,e.message);console.error(e);p.unload(r)}},
  unload(r){const rt=RT[r.id];if(!rt)return;rt.dis.reverse().forEach(f=>{try{f()}catch(e){}});rt.dis=[]},
  reload(r){p.unload(r);p.load(r,false)},
  remove(id){const r=p.get(id);if(!r)return;p.unload(r);L.splice(L.indexOf(r),1);delete RT[id];save()},
  bootAll(){L.forEach(r=>{p.load(r,!!r._f);delete r._f});save()}};
 return p})();

 $('[data-x=bk]',R).onclick=back;const ib=$('.ib',R),bt=el('button','b'+(st==='installato'?'':' p'),st==='nuovo'?'Installa':st==='aggiornamento'?'Aggiorna':'Installato');bt.disabled=st==='installato';bt.onclick=()=>doInstall(it);ib.append(bt);

 const rf=$('.rf',R);rf.innerHTML='<select class=in><option value=5>★★★★★</option><option value=4>★★★★☆</option><option value=3>★★★☆☆</option><option value=2>★★☆☆☆</option><option value=1>★☆☆☆☆</option></select> <input class="in rt" style="width:55%" placeholder="Scrivi una recensione…" maxlength=400> <button class="b p">Pubblica</button> <button class=b>Condividi su GitHub</button>';
 const sel=$('select',rf),txt=$('.rt',rf),bs=$$('button',rf);
 bs[0].onclick=()=>{PB.rev[it.id]=(PB.rev[it.id]||[]).filter(r=>r.u!==user).concat({s:+sel.value,t:txt.value.trim(),u:user,d:Date.now()});S('hos.pb.r',PB.rev);detail(R,it,back)};
 bs[1].onclick=()=>{if(!PB.cfg.repo)return K.alert('Collega prima un repository GitHub da «Sorgente».');window.open('https://github.com/'+PB.cfg.repo+'/issues/new?title='+encodeURIComponent('Recensione '+sel.value+'★: '+it.name+' ('+it.id+')')+'&body='+encodeURIComponent(txt.value),'_blank','noopener')};
 $('.rl',R).innerHTML=s.L.slice(0,30).map(r=>'<div class=card><span style="color:#f0b429">'+stars(r.s)+'</span> <b>'+esc(r.u||'Anonimo')+'</b> <small>'+(r.d?new Date(r.d).toLocaleDateString('it-IT'):'')+'</small><br>'+esc(r.t||'')+'</div>').join('')||'<small>Ancora nessuna recensione.</small>'};
const srcDlg=done=>{const m=el('div','modal'),d=el('div','dlg glass'),c=PB.cfg;
 d.innerHTML='<div class=dt>Sorgente pacchetti (cartella GitHub)</div><div class=dbd><p>Repository pubblico nel formato <code>utente/repo</code>. La cartella può contenere un <code>index.json</code> (<code>{"packages":[{"id","name","version","icon","description","category","tags":[],"author","permissions":[],"updated","rating","votes","file":"x.json"}]}</code>) oppure solo file pacchetto .json: in tal caso vengono letti direttamente.</p><div style="display:grid;gap:6px"><input class="in r" placeholder="utente/repo"><input class="in br" placeholder="ramo (main)"><input class="in pa" placeholder="cartella nel repo (facoltativa)"></div></div><div class=dbt><button class="b p ok">Collega</button><button class="b off">Scollega</button><button class="b no">Annulla</button></div>';
 $('.r',d).value=c.repo;$('.br',d).value=c.branch;$('.pa',d).value=c.path;m.append(d);$('#os').append(m);

 $('.ok',d).onclick=()=>go({repo:$('.r',d).value.trim(),branch:$('.br',d).value.trim()||'main',path:$('.pa',d).value.trim()});$('.off',d).onclick=()=>go(null);$('.no',d).onclick=()=>m.remove()};
K.app({id:'pkgbrowser',name:'Package Browser',icon:'🛍️',color:'#0f7b6c',single:true,open(){
 return K.wm.create({title:'Package Browser',icon:'🛍️',w:980,h:640,render(b,w){
  b.style.cssText='display:flex;flex-direction:column';
  b.innerHTML='<div class=bar><input class="in qi" style="flex:1;min-width:180px" placeholder=\'Cerca…  tag:x  autore:x  cat:app  perm:net  -perm:net  stelle:>=4  stato:nuovo  "frase esatta"\'><select class="in so"><option value=rel>Rilevanza</option><option value=name>Nome</option><option value=rate>Valutazione</option><option value=date>Più recenti</option><option value=perm>Meno permessi</option></select><button class=b data-a=src>⚙ Sorgente</button><button class=b data-a=ref>↻ Aggiorna</button></div><div class=fmb><div class="side fl" style="width:215px;padding:8px 0"></div><div class=pm style="flex:1;overflow:auto;padding:10px;user-select:text"></div></div><div class=sb><span class=s1></span><span class=s2></span></div>';
  const QI=$('.qi',b),SO=$('.so',b),FL=$('.fl',b),PM=$('.pm',b),o={cat:'',min:0,st:'',noperm:[],safe:false,sort:'rel'};let view=null;
  const cnt=(k)=>{const x={};PB.items.forEach(i=>(k==='cat'?[i.cat]:k==='tag'?i.tags:i.perms).forEach(t=>x[t]=(x[t]||0)+1));return Object.entries(x).sort((a,c)=>c[1]-a[1])};
  const sl=(opts,val,fn)=>{const s=el('select','in');s.style.cssText='margin:2px 10px;width:calc(100% - 20px)';opts.forEach(([v,l])=>{const x=el('option','',l);x.value=v;s.append(x)});s.value=val;s.onchange=()=>{fn(s.value);view=null;draw()};FL.append(s)};
  const H=t=>FL.append(el('h4','',t));
  const drawFl=()=>{FL.innerHTML='';H('Categoria');[['','Tutte',PB.items.length]].concat(cnt('cat').map(([k,n])=>[k,k,n])).forEach(([k,l,n])=>{const d=el('div','si'+(o.cat===k?' on':''),esc(l)+' <span style="float:right;color:var(--dim)">'+n+'</span>');d.onclick=()=>{o.cat=k;view=null;draw()};FL.append(d)});
   H('Valutazione minima');sl([[0,'Qualsiasi'],[3,'3★ o più'],[4,'4★ o più'],[4.5,'4,5★ o più']],o.min,v=>o.min=+v);
   H('Stato');sl([['','Tutti'],['nuovo','Non installati'],['installato','Installati'],['aggiornamento','Aggiornabili']],o.st,v=>o.st=v);
   H('Evita questi permessi');cnt('perm').forEach(([k,n])=>{const l=el('label','','<input type=checkbox> '+esc(P[k][0])+' <small style="color:var(--dim)">('+n+')</small>'),c=$('input',l);l.style.cssText='display:flex;gap:6px;padding:2px 12px;align-items:center';c.checked=o.noperm.includes(k);c.onchange=()=>{o.noperm=c.checked?o.noperm.concat(k):o.noperm.filter(x=>x!==k);view=null;draw()};FL.append(l)});
   H('Sicurezza');const l=el('label','','<input type=checkbox> Solo senza permessi sensibili'),c=$('input',l);l.style.cssText='display:flex;gap:6px;padding:2px 12px;align-items:center';c.checked=o.safe;c.onchange=()=>{o.safe=c.checked;view=null;draw()};FL.append(l);
   H('Tag popolari');const tg=el('div');tg.style.padding='0 8px';cnt('tag').slice(0,14).forEach(([t])=>{const x=el('span','chip',esc(t));x.style.cursor='pointer';x.onclick=()=>{QI.value=(QI.value+' tag:'+t).trim();view=null;draw()};tg.append(x)});FL.append(tg);
   const rs=el('button','b','Azzera filtri');rs.style.margin='12px 10px';rs.onclick=()=>{Object.assign(o,{cat:'',min:0,st:'',noperm:[],safe:false});QI.value='';view=null;draw()};FL.append(rs)};
  const card=it=>{const s=stats(it),rk=risk(it),st=ST(it),c=el('div','card'),f=el('div');c.style.cssText='margin:0;cursor:pointer';
   c.innerHTML='<div style="display:flex;gap:10px"><span style="font-size:32px">'+esc(it.icon)+'</span><div style="min-width:0;flex:1"><b>'+esc(it.name)+'</b> <small>v'+esc(it.version)+'</small><br><small><span style="color:#f0b429">'+stars(s.avg)+'</span> '+(s.n?s.avg.toFixed(1)+' ('+s.n+')':'nuovo')+' · '+esc(it.author)+'</small></div></div><div style="color:var(--dim);font-size:12px;height:34px;overflow:hidden;margin:6px 0">'+esc(it.desc)+'</div><span class=chip>'+esc(it.cat)+'</span><span class=chip style="border-color:'+rk[2]+';color:'+rk[2]+'">'+rk[1]+'</span>';
   const bt=el('button','b'+(st==='installato'?'':' p'),st==='nuovo'?'Installa':st==='aggiornamento'?'Aggiorna':'Installato');bt.disabled=st==='installato';bt.onclick=e=>{e.stopPropagation();doInstall(it)};f.style.cssText='text-align:right;margin-top:6px';f.append(bt);c.append(f);c.onclick=()=>{view=it.id;draw()};return c};
  const draw=()=>{drawFl();const it=view&&PB.items.find(x=>x.id===view);if(it){detail(PM,it,()=>{view=null;draw()});return}view=null;
   const R=search(QI.value,o);PM.innerHTML='<div style="color:var(--dim);margin-bottom:8px">'+esc(PB.status)+'</div>';
   const g=el('div');g.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px';R.forEach(i=>g.append(card(i)));if(!R.length)g.append(el('p','','Nessun pacchetto corrisponde: prova a togliere qualche filtro.'));PM.append(g);
   $('.s1',b).textContent=R.length+' di '+PB.items.length+' pacchetti';$('.s2',b).textContent=PB.items.filter(i=>ST(i)==='aggiornamento').length+' aggiornamenti disponibili'};
  QI.oninput=()=>{view=null;draw()};SO.onchange=()=>{o.sort=SO.value;draw()};
  b.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.dataset.a==='src')srcDlg(draw);else{PM.textContent='Aggiornamento del catalogo…';PB.load().then(draw)}});
  w.onclose.push(K.on('pk',draw));QI.focus();
  if(PB.loaded)draw();else{PM.textContent='Collegamento al catalogo…';PB.load().then(draw)}}})}});

/* ===== varianti del sistema: copia dell'OS con pacchetti incorporati ===== */
(()=>{const E=EMB,L=K.pk.list;if(!E.pk)return;const SE=J('hos.emb',[]);
 E.pk.forEach(e=>{if(SE.includes(e.id))return;SE.push(e.id);if(K.pk.get(e.id))K.pk.remove(e.id);
  L.push({id:e.id,name:e.name,version:e.version,icon:e.icon,description:e.description,preset:e.preset,perms:(e.granted||[]).filter(x=>P[x]),enabled:e.enabled!==false,code:e.code||'',css:e.css||'',files:e.files||{},config:e.config||{},requested:e.permissions||[],emb:1,_f:1})});
 S('hos.emb',SE);K.pk.persist();if(E.name)document.title=E.name})();
const buildOS=(name,recs,withCfg)=>{const c=document.documentElement.cloneNode(true),q=s=>c.querySelector(s);
 c.removeAttribute('style');['class','style'].forEach(a=>q('body').removeAttribute(a));
 c.querySelectorAll('#themecss,style[data-pkg],#hos-embed,.modal,.cm,#off').forEach(x=>x.remove());
 ['tb','icons','wl','wins','toasts','start','lock','wall'].forEach(i=>{const e=q('#'+i);if(e){e.innerHTML='';e.removeAttribute('style');e.className=i==='tb'||i==='start'?'glass':''}});
 const os=q('#os');os.className='';os.removeAttribute('data-tp');os.removeAttribute('style');q('title').textContent=name;
 const cfg=Object.assign({},K.cfg.get());delete cfg.pw;
 const data={name,kp:'hosv'+K.hash(name+Date.now())+'.',cfg:withCfg?cfg:{},pk:recs.map(r=>({id:r.id,name:r.name,version:r.version,icon:r.icon,description:r.description,preset:r.preset,permissions:r.requested.length?r.requested:r.perms,granted:r.perms,enabled:r.enabled,config:r.config,code:r.code,css:r.css,files:r.files}))};
 const s=el('script');s.id='hos-embed';s.type='application/json';s.textContent=JSON.stringify(data).replace(/</g,'\\u003c');q('#hos-main').before(s);
 return'<!DOCTYPE html>\n'+c.outerHTML};
K.sPages.push({id:'variants',t:'Varianti del sistema',i:'🧬',custom:pg=>{const L=K.pk.list,sel=new Set(L.filter(r=>r.enabled).map(r=>r.id));let withCfg=true;
 pg.append(el('p','','Crea una <b>nuova copia di htmlOS</b> (file .html) con i pacchetti scelti già scritti nel codice, con i permessi concessi e le configurazioni attuali: aprendola i pacchetti ci sono già, senza importare salvataggi. Ogni variante ha dati propri (file e impostazioni), separati da quelli degli altri htmlOS aperti dallo stesso indirizzo. I pacchetti restano soggetti ai permessi che hai concesso, applicati dal sistema a ogni chiamata delle API (non è un isolamento a livello di browser).'));
 if(EMB.name)pg.append(el('div','card','Questa è la variante <b>'+esc(EMB.name)+'</b> · '+(EMB.pk||[]).length+' pacchetti incorporati.'));
 const nm=el('input','in');nm.value='htmlOS personalizzato';nm.style.cssText='width:260px';const r1=el('label','row','<span>Nome della variante</span>'),c1=el('span','ctl');c1.append(nm);r1.append(c1);pg.append(r1);
 const r2=el('label','row','<span>Includi le impostazioni attuali (tema, sfondo, barra…) come predefinite</span>'),cb=el('input','sw');cb.type='checkbox';cb.checked=true;cb.onchange=()=>withCfg=cb.checked;r2.append(cb);pg.append(r2);
 pg.append(el('h3','','Pacchetti da incorporare'));if(!L.length)pg.append(el('p','','Nessun pacchetto installato: la copia conterrà solo il sistema base.'));
 L.forEach(r=>{const l=el('label','row','<span>'+esc(r.icon)+' <b>'+esc(r.name)+'</b> <small>v'+esc(r.version)+'</small> '+r.perms.map(x=>'<span class="chip'+(SENS.includes(x)?' w':'')+'">'+esc(P[x][0])+'</span>').join('')+'</span>'),c=el('input','sw');c.type='checkbox';c.checked=sel.has(r.id);c.onchange=()=>c.checked?sel.add(r.id):sel.delete(r.id);l.append(c);pg.append(l)});
 const bt=el('button','b p','⬇ Crea copia di htmlOS');bt.style.marginTop='12px';
 bt.onclick=async()=>{const name=nm.value.trim()||'htmlOS personalizzato',recs=L.filter(r=>sel.has(r.id));
  if(recs.some(r=>r.perms.includes('system'))&&!await K.confirm('Alcuni pacchetti selezionati hanno accesso al kernel e saranno incorporati con quei permessi. Continuare?'))return;
  try{K.fs.flush();const a=el('a');a.download='htmlOS-'+(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'variante')+'.html';a.href=URL.createObjectURL(new Blob([buildOS(name,recs,withCfg)],{type:'text/html'}));document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);K.notify('Copia creata',name+' · '+recs.length+' pacchetti incorporati')}catch(e){K.alert(e.message)}};
 pg.append(bt)}});

/* ===== avvio ===== */
let lastAct=Date.now();
function startup(){K.cfg.get('autostart').forEach(id=>{if(K.apps[id])K.launch(id)})}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#start,#orb'))K.shell.start(false);if(!e.target.closest('.cm'))K.closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){K.shell.start(false);K.closeMenu()}});
document.addEventListener('contextmenu',e=>{if(e.defaultPrevented)return;if(e.target.closest('input,textarea'))return;e.preventDefault();
 if(['desk','wall','icons'].includes(e.target.id)){K.shell.dsel=null;K.menu(e.clientX,e.clientY,[{l:'Nuova cartella',f:()=>K.ops.newFolder('/Desktop')},{l:'Nuovo file di testo',f:()=>K.ops.newFile('/Desktop')},{l:'Incolla',off:!K.ops.clip,f:()=>K.ops.paste('/Desktop')},'-',{l:'Aggiorna',f:()=>K.shell.icons()},{l:'Personalizza',f:()=>K.launch('settings',{page:'pers'})},{l:'Impostazioni',f:()=>K.launch('settings')}].concat(K.hooks('desktop',{})))}});
$('#tb').addEventListener('contextmenu',e=>{if(e.defaultPrevented)return;e.preventDefault();K.menu(e.clientX,e.clientY,[{l:'Mostra desktop',f:()=>K.shell.showDesk()},{l:'Impostazioni barra',f:()=>K.launch('settings',{page:'tb'})}].concat(K.hooks('taskbar',{})))});
$('#desk').addEventListener('pointerdown',e=>{if(['desk','wall','icons'].includes(e.target.id)){K.shell.dsel=null;$$('.di').forEach(x=>x.classList.remove('sel'))}});
$('#desk').addEventListener('dragover',e=>e.preventDefault());
$('#desk').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files&&e.dataTransfer.files.length)K.ops.upload('/Desktop',e.dataTransfer.files)});
['pointerdown','keydown','pointermove'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{const m=+K.cfg.get('lockMin');if(m>0&&!$('#lock.on')&&Date.now()-lastAct>m*60000)K.lock()},15000);
setInterval(K.shell.clock,1000);
let ir=0;const refreshIcons=()=>{if(ir)return;ir=1;requestAnimationFrame(()=>{ir=0;K.shell.icons()})};
K.on('settings',()=>{K.shell.tb();K.shell.icons();if($('#start').classList.contains('on'))K.shell.start(true)});
K.on('apps',()=>{refreshIcons();if($('#start').classList.contains('on'))K.shell.buildStart()});
K.on('fs',p=>{if(String(p).startsWith('/Desktop')||p==='/')refreshIcons()});
K.apply();seed();K.shell.tb();K.shell.icons();
if(!K.safe)K.pk.bootAll();else K.notify('Modalità provvisoria','I pacchetti non sono stati caricati.');
K.apply();
if(K.cfg.get('pw')||K.cfg.get('login'))K.lock();else{K.started=1;startup();if(!J('hos.hello',0)){S('hos.hello',1);K.notify('Benvenuto in htmlOS','Apri il menu Start dall’orb in basso a sinistra.')}}
</script></body></html>
